name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        database: [sqlite, mysql, mariadb]
        include:
          - database: sqlite
            database-url: ''
          - database: mysql
            database-url: 'mysql://root:secret@127.0.0.1:3306/session_test?serverVersion=8.0'
          - database: mariadb
            database-url: 'mysql://root:secret@127.0.0.1:3307/session_test?serverVersion=11.4.0-MariaDB'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: session_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: session_test
        ports: ['3307:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer test
        env:
          DATABASE_URL: ${{ matrix.database-url }}
